services:
  postgres:
    image: postgres:17
    container_name: financial-sentiment-db

    environment:
      POSTGRES_DB: financial_sentiment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: